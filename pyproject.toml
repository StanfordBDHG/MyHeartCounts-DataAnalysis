[project]
name = "myheartcounts-ds"
version = "0.1.0"
description = "Data science package for MyHeartCounts 4.0 Data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-cloud-firestore>=2.0.0",
    "google-cloud-storage>=2.0.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
    "zstandard>=0.21.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[project.scripts]
mhc-ds = "myheartcounts_ds.cli:main"

[tool.uv]
dev-dependencies = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "nbstripout>=0.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"notebooks/*.ipynb" = ["E703", "B018", "F401", "F841", "F811", "C414", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["myheartcounts_ds"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myheartcounts_ds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
